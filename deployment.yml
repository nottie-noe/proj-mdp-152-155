apiVersion: apps/v1
kind: Deployment
metadata:
  name: javacal-deployment
  labels:
    app: javacal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: javacal
  template:
    metadata:
      labels:
        app: javacal
    spec:
      containers:
      - name: javacal-container
        image: nottiey/javacal-webapp:latest
        ports:
        - containerPort: 8080

