---
- name: Set up Kubernetes cluster dependencies and create cluster
  hosts: localhost
  become: yes
  vars_files:
    - ../group_vars/all.yml     # Loads cluster_name, s3_bucket_name, aws_region, zones, etc.

  vars:
    common_flags: "--name={{ cluster_name }} --state=s3://{{ s3_bucket_name }}"

  tasks:
    - name: Install dependencies
      package:
        name:
          - curl
          - unzip
          - python3-pip
        state: present

    - name: Install AWS CLI
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update
      args:
        creates: /usr/local/bin/aws

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      args:
        creates: /usr/local/bin/kubectl

    - name: Install KOPS
      shell: |
        curl -LO https://github.com/kubernetes/kops/releases/download/$(curl -s https://api.github.com/repos/kubernetes/kops/releases/latest | grep tag_name | cut -d '"' -f 4)/kops-linux-amd64
        sudo chmod +x kops-linux-amd64
        sudo mv kops-linux-amd64 /usr/local/bin/kops
      args:
        creates: /usr/local/bin/kops

    - name: Create Kubernetes cluster
      include_tasks: create_cluster.yml

