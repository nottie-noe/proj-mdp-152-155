---
# Cluster configuration
cluster_name: "prod-cluster.k8s.local"
state_store: "s3://kopscluster-state-bucket"
aws_region: "us-east-1"
zones: "us-east-1a,us-east-1b,us-east-1c"
kubernetes_version: "1.32.4"
network_cidr: "172.20.0.0/16"
topology: "private"
networking: "calico"

# Node configuration
master_count: 3
node_count: 3
master_instance_type: "t3.medium"  # Default, not specified in config
node_instance_type: "t3.medium"    # Default, not specified in config

# Security
ssh_key_path: "~/.ssh/kops-rsa"

# Cloud labels
cloud_labels:
  Environment: "Prod"
